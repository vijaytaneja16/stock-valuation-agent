[project]
name = "stock-valuation-agent"
version = "0.1.0"
description = "An agentic stock valuation tool: Claude + MCP tool servers + a deterministic Python valuation engine"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "fastmcp>=0.4.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.40",
    "streamlit>=1.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
