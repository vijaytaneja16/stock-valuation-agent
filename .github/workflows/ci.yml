name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run tests (pure calculation logic -- no API keys needed)
        run: pytest tests/test_metrics.py tests/test_adjusted_earnings.py tests/test_multiples.py tests/test_engine.py -v
